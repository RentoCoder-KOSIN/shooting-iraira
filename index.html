<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
        />
        <title>世界一イライラするゲーム</title>
        <link rel="stylesheet" href="style.css" />
        <script src="config.js" defer></script>
        <script src="script.js" defer></script>
    </head>
    <body>
        <!-- The game is drawn here by script.js -->
        <canvas id="c" width="480" height="640"></canvas>

        <!-- Admin overlay (Shift+@ to open). Styles are in style.css -->
        <div id="admin" hidden>
            <div
                class="admin-box"
                role="dialog"
                aria-modal="true"
                aria-label="admin"
            >
                <div id="admin-login">
                    <h2>ADMIN</h2>
                    <input
                        id="admin-pass"
                        type="password"
                        autocomplete="off"
                        placeholder="password"
                    />
                    <p id="admin-msg"></p>
                    <button id="admin-ok">ログイン</button>
                    <button class="sub" data-close>閉じる</button>
                </div>
                <div id="admin-panel" hidden>
                    <h2>ADMIN PANEL</h2>
                    <label
                        ><input type="checkbox" id="admin-inv" />
                        無敵モード</label
                    >
                    <button id="admin-reset" class="danger">
                        全スコアボードをリセット
                    </button>
                    <p id="admin-reset-msg"></p>
                    <button class="sub" data-close>閉じる (Esc)</button>
                </div>
            </div>
        </div>

        <!-- Name entry after a run (opened by script.js). Styles are in style.css -->
        <div id="score" hidden>
            <div class="admin-box" role="dialog" aria-modal="true" aria-label="score">
                <h2>記録を登録</h2>
                <p id="score-result"></p>
                <input id="score-name" type="text" autocomplete="off" placeholder="なまえ" />
                <p id="score-msg"></p>
                <button id="score-ok">登録</button>
                <button class="sub" id="score-skip">登録しない</button>
            </div>
        </div>
    </body>
</html>
