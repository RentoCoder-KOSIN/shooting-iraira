<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
        />
        <title>世界一イライラするゲーム</title>
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                background: #0b0b14;
                overflow: hidden;
            }
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: sans-serif;
            }
            canvas {
                /* size is set from JS (layout) so it always fills the window */
                display: block;
                background: #10101c;
                cursor: pointer;
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
                -webkit-tap-highlight-color: transparent;
            }
            /* admin overlay (DOM, not canvas, so we can use a real password input) */
            #admin {
                position: fixed;
                inset: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                background: rgba(0, 0, 0, 0.65);
                z-index: 10;
            }
            #admin[hidden],
            #admin [hidden] {
                display: none;
            }
            .admin-box {
                width: min(320px, 86vw);
                padding: 20px;
                background: #14142a;
                border: 1px solid #6af;
                border-radius: 8px;
                color: #fff;
                font-size: 15px;
            }
            .admin-box h2 {
                margin: 0 0 14px;
                font-size: 18px;
                color: #6af;
            }
            .admin-box input[type="password"] {
                width: 100%;
                box-sizing: border-box;
                padding: 8px;
                font-size: 16px;
                background: #0b0b14;
                color: #fff;
                border: 1px solid #556;
                border-radius: 4px;
            }
            .admin-box button {
                margin-top: 12px;
                margin-right: 8px;
                padding: 8px 14px;
                font-size: 14px;
                color: #012;
                background: #6af;
                border: 0;
                border-radius: 4px;
                cursor: pointer;
            }
            .admin-box button.sub {
                color: #ccd;
                background: #334;
            }
            .admin-box label {
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
            }
            #admin-msg {
                min-height: 1.2em;
                margin: 8px 0 0;
                font-size: 13px;
                color: #f77;
            }
        </style>
    </head>
    <body>
        <canvas id="c" width="480" height="640"></canvas>
        <div id="admin" hidden>
            <div class="admin-box" role="dialog" aria-modal="true" aria-label="admin">
                <div id="admin-login">
                    <h2>ADMIN</h2>
                    <input id="admin-pass" type="password" autocomplete="off" placeholder="password" />
                    <p id="admin-msg"></p>
                    <button id="admin-ok">ログイン</button>
                    <button class="sub" data-close>閉じる</button>
                </div>
                <div id="admin-panel" hidden>
                    <h2>ADMIN PANEL</h2>
                    <label><input type="checkbox" id="admin-inv" /> 無敵モード</label>
                    <button class="sub" data-close>閉じる (Esc)</button>
                </div>
            </div>
        </div>
        <script>
            "use strict";

            /* =====================================================================
             *  定数・データ
             * ===================================================================== */
            const canvas = document.getElementById("c");
            const ctx = canvas.getContext("2d");
            // logical height is fixed; logical width follows the window aspect ratio
            const H = 640,
                MIN_W = 480,
                MAX_W = 1280,
                PI = Math.PI;
            let W = MIN_W; // logical width (updated by layout())
            let CX = W / 2; // horizontal center
            const STEP_MS = 16.67; // 固定タイムステップ(約60fps)

            const PLAYER_MAX_HP = 8;
            const PLAYER_START = { x: 240, y: 580 }; // x is updated by layout()
            const BOSS_HP = [170, 220, 260, 340]; // 形態ごとのボスHP
            const FORM_NAMES = "一二三四";

            // 玉の種類(色の並び順と一致)
            const ORB = { INVERT: 0, HEAL: 1, GAG: 2, DOUBLE: 3, FAKE: 4 };
            const ORB_COLORS = ["#f93", "#f33", "#39f", "#3c3", "#a4f"];

            // Select screen orbs: c = color, k = effect (ORB.*). Edit this table to tune the lineup.
            const SELECT_ORBS = [
                { c: "#f93", n: "橙", k: ORB.INVERT },
                { c: "#f33", n: "赤", k: ORB.HEAL },
                { c: "#39f", n: "青", k: ORB.GAG },
                { c: "#3c3", n: "緑", k: ORB.DOUBLE },
                { c: "#a4f", n: "紫", k: ORB.FAKE },
            ];

            // Legend shown on the first selection. Effects can change later, so the wording stays vague (".....").
            const ORB_HINTS = {
                [ORB.INVERT]: "なんだか世界が.....",
                [ORB.HEAL]: "体力が.....",
                [ORB.GAG]: "ちょっとした余興が.....",
                [ORB.DOUBLE]: "痛みが.....",
                [ORB.FAKE]: "終わった.....？",
            };

            // 2nd selection only: the red and blue orbs swap abilities (indices into SELECT_ORBS).
            // Every other orb, and every falling orb, keeps its own ability.
            const SELECT_SWAP_PAIR = [1, 2]; // red (#f33), blue (#39f)
            const selectEffect = (i) => {
                const [a, b] = SELECT_SWAP_PAIR;
                if (swapOrbs && i === a) return SELECT_ORBS[b].k;
                if (swapOrbs && i === b) return SELECT_ORBS[a].k;
                return SELECT_ORBS[i].k;
            };
            const SEL_COLS = 5, // orbs per row
                SEL_GAP = 80, // distance between orbs
                SEL_R = 20, // orb radius
                SEL_PICK = 24; // pickup distance

            // 第2形態以降で降ってくる玉の順番(固定)。落下位置はランダム
            const ORB_ORDER_MAIN = [1, 2, 3, 4, 0, 3, 4, 2, 1, 0];
            const ORB_ORDER_PATTERN = [1, 2, 3, 4, 0, 4];

            // 移動キー以外のキーで1回だけ使える回復(デバッグ表示つき)
            // red orb: 80% -> +2 life & boss x1.3, 20% -> full heal & boss x1.5
            const HEAL_SMALL = 2;
            const HEAL_FULL_CHANCE = 0.2;
            const BUFF_SMALL = 1.3;
            const BUFF_FULL = 1.5;
            const FAKE_INV_FRAMES = 300; // purple orb: 5 seconds of invincibility when the fake game over ends
            // bullet pace (緩急): every bullet speeds up and slows down by the same sine law of its age
            const PACE_AMP = 0.35; // +-35% around the base speed
            const PACE_PERIOD = 120; // frames per cycle
            // extra tempo on top of the smooth pace: some bullets stop and burst, some creep and then dash
            const TEMPO_STOP_CHANCE = 0.12; // stop for a moment, then burst forward
            const TEMPO_DASH_CHANCE = 0.12; // creep slowly, then suddenly dash
            const rand = (a, b) => a + Math.random() * (b - a);
            // speed factor of a bullet by its age (1 = normal)
            const tempoFactor = (b) => {
                if (b.mode === "stop") {
                    if (b.age < b.t1) return 1;
                    if (b.age < b.t1 + b.d) return 0; // stopped
                    return 1 + 1.2 * Math.exp(-(b.age - b.t1 - b.d) / 30); // burst, easing back to normal
                }
                if (b.mode === "dash") return b.age < b.t1 ? 0.45 : 2.0; // creep, then suddenly fast
                return 1;
            };
            const INVERT_FRAMES = 600; // orange orb: controls reversed for 10 seconds
            const KEY_HEAL = 3; // 回復量
            const KEY_BOSS_BUFF = 0.1; // ボス強化(弾速倍率に加算)
            const KEY_DEBUG_FRAMES = 180;
            const SECRET_KEY_CANDIDATES = "bceghijklmnopqrtuvxyz0123456789"; // 移動キー(WASD)とFは除外
            // keys that never count as a guess (movement, fullscreen, advance, modifiers)
            const IGNORED_KEYS = new Set([
                "w", "a", "s", "d", "f",
                "arrowup", "arrowdown", "arrowleft", "arrowright",
                "enter", " ", "shift", "control", "alt", "meta",
                "tab", "escape", "capslock",
            ]);
            const S = {
                TITLE: "title",
                SELECT: "select",
                PLAY: "play",
                GAG: "gag",
                FAKE: "fake",
                FCLEAR: "fclear",
                OVER: "over",
                WIN: "win",
            };

            // ボタン領域
            const BTN_FAKE_RESTART = { x: 170, y: 340, w: 140, h: 60 }; // x is updated by layout()
            const BTN_GAG_DONE = { x: 150, y: 420, w: 180, h: 60 }; // x is updated by layout()

            // Extra confirmations after pressing the first "done" button (blue orb / gag state)
            const GAG_CONFIRMS = [
                "本当に終わりましたか？",
                "ちゃんと全力でやりましたか？",
                "最終確認：もう思い残すことはありませんか？",
            ];
            const GAG_LOCK_FRAMES = 30; // ignore presses right after one (prevents double-click skipping)

            const GAG_TEXTS = [
                "全力で変な顔をしてください",
                "3秒間、最高にカッコいいポーズ",
                "自分を褒めるセリフを言ってください",
                "急にアイドルになってください",
                "必殺技名を考えて叫んでください",
                "自分の名前をめちゃくちゃカッコよく言って！",
                "え〜♡ そんなこともできないの〜？",
                "ねぇねぇ♡ がんばってぇ〜♡",
                "えへへ♡ かわいいでしょ〜♡",
                "お願い♡ 一回だけやってぇ〜♡",
                "恥ずかしがらなくていいよ♡",
            ];
            const TAUNTS = [
                "こんなんで負けちゃうんだ",
                "ザッコ",
                "よっわ",
                "切り抜きよろしく〜",
                "また勝っちゃった",
                "なんで負けたか自分の悪かった点をどうぞ！",
                "よわよわのいわし",
                "うえええええええええええい勝ったあああああああ",
                "今のは避けれたよね",
                "なんで球に当たるのかな",
                "まだ第◯形態だけど大丈夫？",
                "うぉ",
                "ど、どわー",
                "今の攻撃きつかった？",
                "え、よわ",
                "笑",
            ];

            /* =====================================================================
             *  ゲーム状態
             * ===================================================================== */
            let state; // 現在の画面状態
            let player; // {x, y, hp, inv}
            let boss; // {x, y, hp, max}
            let bullets, beams, shots, orbs, queue, history;
            let speedMul; // 弾速倍率(赤玉で上昇)
            let dmgMul; // 被ダメージ倍率(緑玉で2倍)
            let phase; // 形態(0〜3)
            let patIdx, patTime; // 攻撃シーケンス内の位置と経過フレーム
            let frame; // 全体フレームカウンタ
            let swapOrbs; // true during the 2nd selection: red/blue abilities are swapped
            let midPickDone; // 第2形態の途中選択を済ませたか
            let fakeTimer, clearTimer, gagText, tauntText;
            let invertTimer; // frames left of reversed controls (orange orb)
            let gagStep, gagLock; // gag confirmation progress (0 = first screen) / press cooldown
            let keyHealUsed; // ランダムキー回復を使ったか
            let secretKey; // 回復が発動する「ランダムな1キー」(ゲームごとに抽選)
            let keyDebug; // デバッグ表示 {text, t}

            // grid centered on the screen (both horizontally and vertically)
            const selectOrbPos = (i) => {
                const rows = Math.ceil(SELECT_ORBS.length / SEL_COLS);
                return {
                    x: CX + ((i % SEL_COLS) - (SEL_COLS - 1) / 2) * SEL_GAP,
                    y: H / 2 + (((i / SEL_COLS) | 0) - (rows - 1) / 2) * SEL_GAP,
                };
            };
            const pick = (arr) => arr[(Math.random() * arr.length) | 0];

            function resetGame() {
                state = S.TITLE;
                swapOrbs = false;
                midPickDone = false;
                keyHealUsed = false;
                invertTimer = 0;
                secretKey = pick([...SECRET_KEY_CANDIDATES]);
                keyDebug = { text: "", t: 0 };
                player = {
                    x: PLAYER_START.x,
                    y: PLAYER_START.y,
                    hp: PLAYER_MAX_HP,
                    inv: 0,
                };
                bullets = [];
                beams = [];
                shots = [];
                orbs = [];
                queue = [];
                history = [];
                speedMul = 1.1;
                dmgMul = 1;
                phase = 0;
                patIdx = 0;
                patTime = 0;
                frame = 0;
                boss = { x: CX, y: 90, hp: BOSS_HP[0], max: BOSS_HP[0] };
            }

            /* =====================================================================
             *  入力
             * ===================================================================== */
            const keys = {};

            /* ---- admin mode (Shift+@ to open) ----
             * NOTE: this password lives in the client code, so anyone who views the source can read it.
             * It is a gate for fun, not real security. */
            const ADMIN_PASSWORD = "mint";
            let adminOpen = false; // while true the game is paused and keys go to the panel
            let adminAuthed = false; // stays true until the page is reloaded
            let invincible = false; // admin: no damage

            const adminEl = document.getElementById("admin");
            const adminLogin = document.getElementById("admin-login");
            const adminPanel = document.getElementById("admin-panel");
            const adminPass = document.getElementById("admin-pass");
            const adminMsg = document.getElementById("admin-msg");
            const adminInv = document.getElementById("admin-inv");

            // JIS keyboard: Shift+@ gives "`". US keyboard: Shift+2 gives "@".
            const isAdminShortcut = (e) =>
                e.shiftKey && (e.key === "@" || e.key === "`");

            function showAdminView() {
                adminLogin.hidden = adminAuthed;
                adminPanel.hidden = !adminAuthed;
                adminMsg.textContent = "";
                adminPass.value = "";
                adminInv.checked = invincible;
                (adminAuthed ? adminInv : adminPass).focus();
            }
            function openAdmin() {
                adminOpen = true;
                for (const k in keys) delete keys[k]; // release held movement keys
                adminEl.hidden = false;
                showAdminView();
            }
            function closeAdmin() {
                adminOpen = false;
                adminEl.hidden = true;
                if (document.activeElement) document.activeElement.blur();
            }
            function tryAdminLogin() {
                if (adminPass.value === ADMIN_PASSWORD) {
                    adminAuthed = true;
                    showAdminView();
                } else {
                    adminMsg.textContent = "パスワードが違います";
                    adminPass.value = "";
                    adminPass.focus();
                }
            }
            adminPass.addEventListener("keydown", (e) => {
                if (e.key === "Enter") tryAdminLogin();
            });
            document.getElementById("admin-ok").addEventListener("click", tryAdminLogin);
            adminInv.addEventListener("change", () => {
                invincible = adminInv.checked;
            });
            adminEl.querySelectorAll("[data-close]").forEach((b) =>
                b.addEventListener("click", closeAdmin),
            );

            function enterFullscreen() {
                const el = document.documentElement;
                const req = el.requestFullscreen || el.webkitRequestFullscreen;
                if (req && !document.fullscreenElement) {
                    try {
                        Promise.resolve(req.call(el)).catch(() => {});
                    } catch (_) {}
                }
            }
            function toggleFullscreen() {
                if (document.fullscreenElement) document.exitFullscreen();
                else enterFullscreen();
            }

            // "done" press in the gag state: needs GAG_CONFIRMS.length extra confirmations
            function pressGagDone() {
                if (gagLock > 0) return;
                gagLock = GAG_LOCK_FRAMES;
                if (gagStep < GAG_CONFIRMS.length) gagStep++;
                else state = S.PLAY;
            }

            // Enter/Space/クリック共通の「次へ」動作
            function advance() {
                if (state === S.TITLE) enterFullscreen(); // スタート時にフルスクリーン化
                if (state === S.GAG) pressGagDone(); // keyboard goes through the same confirmations
                else if (state === S.TITLE) state = S.PLAY;
                else if (state === S.OVER || state === S.WIN) resetGame();
            }

            function canvasPoint(e) {
                const r = canvas.getBoundingClientRect();
                return {
                    x: ((e.clientX - r.left) * W) / r.width,
                    y: ((e.clientY - r.top) * H) / r.height,
                };
            }
            const inButton = (p, b) =>
                p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h;

            // 移動キー以外のキー: 1回だけ回復、代わりにボス強化
            function onOtherKey(e) {
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                if (IGNORED_KEYS.has(e.key.toLowerCase())) return;
                let note = "";
                if (state === S.PLAY) {
                    if (e.key.toLowerCase() !== secretKey) {
                        note = " → ハズレ";
                    } else if (keyHealUsed) {
                        note = " → 使用済み";
                    } else {
                        keyHealUsed = true;
                        player.hp = Math.min(
                            PLAYER_MAX_HP,
                            player.hp + KEY_HEAL,
                        );
                        speedMul += KEY_BOSS_BUFF;
                        note = " → 回復! ボス強化";
                    }
                }
                keyDebug = {
                    text: "押されたキー: " + e.key + note,
                    t: KEY_DEBUG_FRAMES,
                };
            }

            window.addEventListener("keydown", (e) => {
                if (adminOpen) {
                    if (e.key === "Escape") closeAdmin();
                    return; // keys belong to the panel while it is open
                }
                if (isAdminShortcut(e)) {
                    e.preventDefault();
                    openAdmin();
                    return;
                }
                keys[e.key.toLowerCase()] = true;
                if (!e.repeat) {
                    if (e.key.toLowerCase() === "f") toggleFullscreen();
                    onOtherKey(e);
                }
                if (e.key.startsWith("Arrow")) e.preventDefault();
                if (e.key === "Enter" || e.key === " ") {
                    advance();
                    e.preventDefault();
                }
            });
            window.addEventListener("keyup", (e) => {
                keys[e.key.toLowerCase()] = false;
            });

            canvas.addEventListener("click", (e) => {
                const p = canvasPoint(e);
                if (state === S.FAKE) {
                    // 偽ゲームオーバーのRESTARTを押すと最初からやり直し(罠)
                    if (inButton(p, BTN_FAKE_RESTART)) resetGame();
                } else if (state === S.GAG) {
                    if (inButton(p, BTN_GAG_DONE)) pressGagDone();
                } else {
                    advance();
                }
            });

            // タッチ操作: ドラッグした分だけ自機を動かす
            let touch = null;
            const clampPlayer = () => {
                player.x = Math.max(8, Math.min(W - 8, player.x));
                player.y = Math.max(8, Math.min(H - 8, player.y));
            };
            canvas.addEventListener("pointerdown", (e) => {
                if (e.pointerType === "mouse") return;
                touch = { start: canvasPoint(e), px: player.x, py: player.y };
                canvas.setPointerCapture(e.pointerId);
            });
            canvas.addEventListener("pointermove", (e) => {
                if (!touch || (state !== S.PLAY && state !== S.SELECT)) return;
                const q = canvasPoint(e);
                const dir = invertTimer > 0 ? -1 : 1; // reversed while the orange orb is active
                player.x = touch.px + dir * (q.x - touch.start.x);
                player.y = touch.py + dir * (q.y - touch.start.y);
                clampPlayer();
            });
            const endTouch = () => {
                touch = null;
            };
            canvas.addEventListener("pointerup", endTouch);
            canvas.addEventListener("pointercancel", endTouch);

            /* =====================================================================
             *  弾・ビームの生成ヘルパー
             * ===================================================================== */
            const aim = (x, y, target = player) =>
                Math.atan2(target.y - y, target.x - x);
            const aimFromBoss = () => aim(boss.x, boss.y);

            function spawnBullet(x, y, angle, speed, opt = {}) {
                const roll = Math.random();
                const mode =
                    roll < TEMPO_STOP_CHANCE
                        ? "stop"
                        : roll < TEMPO_STOP_CHANCE + TEMPO_DASH_CHANCE
                          ? "dash"
                          : "none";
                bullets.push({
                    mode, // "none" | "stop" | "dash"
                    t1: mode === "stop" ? rand(20, 50) : rand(35, 70), // age when the tempo changes
                    d: rand(25, 55), // how long a "stop" bullet stays still
                    x,
                    y,
                    vx: Math.cos(angle) * speed * speedMul,
                    vy: Math.sin(angle) * speed * speedMul,
                    s: speed * speedMul,
                    r: 5,
                    col: "#f55",
                    del: 0, // 出現までの遅延フレーム
                    hm: 0, // 残りホーミングフレーム
                    ax: 0, // x方向加速度
                    age: 0, // frames since it appeared (drives the pace)
                    ...opt,
                });
            }
            const spawnRing = (x, y, count, speed, offset, opt) => {
                for (let i = 0; i < count; i++)
                    spawnBullet(
                        x,
                        y,
                        offset + (i * 2 * PI) / count,
                        speed,
                        opt,
                    );
            };
            const bossShot = (angle, speed, opt) =>
                spawnBullet(boss.x, boss.y + 20, angle, speed, opt);
            const bossRing = (count, speed, offset, opt) =>
                spawnRing(boss.x, boss.y + 20, count, speed, offset, opt);

            function spawnBeam(
                x,
                y,
                angle,
                turn,
                warn,
                dur,
                width,
                reflections,
            ) {
                beams.push({
                    x,
                    y,
                    a: angle,
                    da: turn,
                    warn,
                    dur,
                    w: width,
                    refl: reflections,
                    age: 0,
                });
            }
            const later = (frames, fn) => queue.push({ t: frames, f: fn });

            // 画面外から降ってくる玉(落下位置はランダム)
            const spawnOrb = (kind) =>
                orbs.push({ x: 70 + Math.random() * (W - 140), y: -10, k: kind });

            /* =====================================================================
             *  攻撃パターン (t = パターン開始からのフレーム)
             * ===================================================================== */
            const GAP_HALF = 36; // wall pattern: half width of the safe gap in px (was 28)
            const PATTERNS = {
                // 4回目だけ軌道が変わる扇弾
                rep(t) {
                    if (t % 60 !== 0 || t >= 240) return;
                    const count = t / 60,
                        a = aimFromBoss();
                    for (let i = -4; i <= 4; i++) {
                        if (count < 3) bossShot(a + i * 0.17, 3);
                        else
                            bossShot(a + i * 0.17, 2.8, {
                                ax: i % 2 ? 0.015 : -0.015,
                                col: "#ff0",
                            });
                    }
                },
                // 避けた先に遅れて弾が出る
                follow(t) {
                    if (t % 100 === 0) {
                        spawnBullet(W + 8, player.y, PI, 4.2, { col: "#5cf" });
                        later(28, () =>
                            spawnBullet(-8, player.y, 0, 4.6, { col: "#5cf" }),
                        );
                    }
                    if (t % 100 === 50) {
                        spawnBullet(player.x, -8, PI / 2, 4.2, { col: "#5cf" });
                        later(28, () =>
                            spawnBullet(player.x, H + 8, -PI / 2, 4.6, {
                                col: "#5cf",
                            }),
                        );
                    }
                },
                // 隙間がゆっくり動く弾の壁
                wall(t) {
                    if (t % 22 !== 0 || t >= 340) return;
                    // Wider screen -> larger sweep but slower frequency, so the gap's
                    // max speed (px per row) stays the same as at W = 480 and stays dodgeable.
                    const gap =
                        CX + Math.sin((t / 22) * 0.45 * (480 / W)) * 150 * (W / 480);
                    // odd rows are shifted by half the spacing -> 1010.. / 0101.. checkerboard
                    const shift = (t / 22) % 2 ? 12 : 0;
                    for (let x = 10 + shift; x < W; x += 24) {
                        if (Math.abs(x - gap) > GAP_HALF)
                            spawnBullet(x, -8, PI / 2, 2.8, {
                                r: 6,
                                col: "#f80",
                                mode: "none", // keep the wall rows intact (no stop / dash)
                            });
                    }
                },
                // ビーム予告＋通常弾
                beam(t) {
                    if (t === 10 || t === 130)
                        spawnBeam(player.x, 0, PI / 2, 0, 50, 30, 18, 0);
                    if (t % 40 === 0) bossRing(10, 2.2, t, {});
                },
                // 追尾して途中で直進する弾
                home(t) {
                    if (t % 50 !== 0 || t >= 250) return;
                    const x = t % 100 ? CX + 120 : CX - 120;
                    spawnBullet(x, 100, aim(x, 100), 2.4, {
                        hm: 80,
                        col: "#f6f",
                        r: 6,
                    });
                },
                // 通った場所に遅れて弾が残る
                trail(t) {
                    if (t % 8 === 0)
                        spawnBullet(player.x, player.y, PI / 2, 1.5, {
                            del: 40,
                            col: "#fa0",
                            r: 4,
                        });
                    if (t % 70 === 0)
                        bossShot(aimFromBoss(), 2.4, {
                            hm: 60,
                            col: "#f6f",
                            r: 6,
                        });
                },
                // 縦ビーム(＋少なめの横ビーム)の隙間が動く
                vbeam(t) {
                    if (t === 0 || t === 150) {
                        const offset = t ? 40 : 0;
                        // beams across the whole width (6 beams when W = 480)
                        const n = Math.floor(W / 80),
                            x0 = (W - (n - 1) * 80) / 2;
                        for (let i = 0; i < n; i++)
                            spawnBeam(
                                x0 + i * 80 + offset,
                                0,
                                PI / 2,
                                0,
                                70,
                                40,
                                36,
                                0,
                            );
                    }
                    // horizontal beams: fewer than vertical (3 per wave), fired between the vertical waves
                    if (t === 70 || t === 210) {
                        const ys = t === 70 ? [180, 340, 500] : [260, 420, 580];
                        for (const y of ys) spawnBeam(0, y, 0, 0, 50, 40, 36, 0);
                    }
                    if (t % 45 === 20) bossShot(aimFromBoss(), 3);
                },
                // 反射ビーム(角度は固定)
                refl(t) {
                    if (t === 0 || t === 150) {
                        for (const f of t ? [0.2, 0.8] : [0.35, 0.65])
                            spawnBeam(
                                boss.x,
                                boss.y + 20,
                                PI * f,
                                0,
                                60,
                                70,
                                12,
                                3,
                            );
                    }
                    if (t % 60 === 30) bossRing(12, 2, t, {});
                },
                // 過去パターンの再利用(最後だけ変更)
                rep2(t) {
                    if (t % 60 !== 0 || t >= 240) return;
                    const count = t / 60,
                        a = aimFromBoss(),
                        early = count < 3;
                    for (let i = -4; i <= 4; i++) {
                        bossShot(a + i * 0.17, early ? 3 : 4.4, {
                            col: early ? "#f55" : "#ff0",
                        });
                    }
                    if (count === 3)
                        later(20, () => bossRing(14, 2.4, 0, { col: "#ff0" }));
                },
                // 数秒前の位置を狙う偽追尾弾
                fake(t) {
                    if (t % 40 === 0)
                        bossShot(
                            aim(boss.x, boss.y + 20, history[0] || player),
                            3.6,
                            { col: "#0ff" },
                        );
                    if (t % 90 === 45) bossRing(8, 2, 0, {});
                },
                // 回転ビーム＋通常弾
                rot(t) {
                    if (t === 0)
                        spawnBeam(
                            boss.x,
                            boss.y + 20,
                            0.2,
                            0.011,
                            40,
                            260,
                            22,
                            0,
                        );
                    if (t % 30 === 0) bossRing(6, 2.3, t * 0.07, {});
                },
                // 玉の混入
                orbs(t) {
                    if (t % 50 === 0 && t < 300)
                        spawnOrb(
                            ORB_ORDER_PATTERN[
                                (t / 50) % ORB_ORDER_PATTERN.length
                            ],
                        );
                    if (t % 45 === 0) bossRing(8, 2.1, t, {});
                },
            };
            const PATTERN_DURATION = {
                rep: 260,
                follow: 300,
                wall: 360,
                beam: 260,
                home: 330,
                trail: 300,
                vbeam: 300,
                refl: 330,
                rep2: 260,
                fake: 300,
                rot: 320,
                orbs: 320,
            };
            // 形態ごとの攻撃シーケンス(同時に走らせるパターンを配列で指定)
            const SEQUENCES = [
                [["rep"], ["follow"], ["wall"], ["beam"]],
                [["home"], ["trail"], ["vbeam"], ["refl"]],
                [["rep2"], ["fake"], ["rot"], ["orbs"]],
                [
                    ["rep2", "home"],
                    ["rot", "wall"],
                    ["refl", "vbeam", "fake"],
                    ["orbs", "trail", "follow"],
                    ["rot", "vbeam", "home", "orbs"],
                ],
            ];

            /* =====================================================================
             *  ビーム当たり判定ユーティリティ
             * ===================================================================== */
            // ビームの折れ線(画面端で反射)
            function beamPath(b) {
                let x = b.x,
                    y = b.y,
                    dx = Math.cos(b.a),
                    dy = Math.sin(b.a);
                const path = [[x, y]];
                for (let i = 0; i <= b.refl; i++) {
                    const tx =
                        dx > 1e-6 ? (W - x) / dx : dx < -1e-6 ? -x / dx : 1e9;
                    const ty =
                        dy > 1e-6 ? (H - y) / dy : dy < -1e-6 ? -y / dy : 1e9;
                    const t = Math.min(tx, ty);
                    x += dx * t;
                    y += dy * t;
                    path.push([x, y]);
                    if (ty <= tx) break; // 上下に当たったら反射せず終了
                    dx = -dx; // 左右に当たったら反射
                }
                return path;
            }

            // 点と線分の距離
            function distToSegment(px, py, a, b) {
                const vx = b[0] - a[0],
                    vy = b[1] - a[1];
                const len2 = vx * vx + vy * vy || 1;
                const t = Math.max(
                    0,
                    Math.min(1, ((px - a[0]) * vx + (py - a[1]) * vy) / len2),
                );
                return Math.hypot(px - a[0] - vx * t, py - a[1] - vy * t);
            }

            /* =====================================================================
             *  ゲームロジック
             * ===================================================================== */
            // 玉を取った時の効果
            function takeOrb(kind) {
                state = S.PLAY;
                switch (kind) {
                    case ORB.INVERT:
                        invertTimer = INVERT_FRAMES; // left/right and up/down reversed
                        break;
                    case ORB.HEAL:
                        if (Math.random() < HEAL_FULL_CHANCE) {
                            player.hp = PLAYER_MAX_HP; // 20%: full heal, boss x1.5
                            speedMul = Math.max(speedMul, BUFF_FULL);
                        } else {
                            player.hp = Math.min(PLAYER_MAX_HP, player.hp + HEAL_SMALL); // 80%: +2, boss x1.3
                            speedMul = Math.max(speedMul, BUFF_SMALL);
                        }
                        break;
                    case ORB.GAG:
                        state = S.GAG;
                        gagStep = 0;
                        gagLock = 0;
                        gagText = pick(GAG_TEXTS);
                        break;
                    case ORB.DOUBLE:
                        dmgMul = 2;
                        break;
                    case ORB.FAKE:
                        state = S.FAKE;
                        fakeTimer = 300;
                        break; // 5秒待てば再開
                }
            }

            function hurtPlayer() {
                if (player.inv > 0 || invincible) return;
                player.hp -= dmgMul;
                player.inv = 60;
                if (player.hp <= 0) {
                    state = S.OVER;
                    tauntText = pick(TAUNTS).replace("◯", FORM_NAMES[phase]);
                }
            }

            function movePlayer() {
                const speed = (keys.shift ? 2 : 4) * (invertTimer > 0 ? -1 : 1);
                if (keys.a || keys.arrowleft) player.x -= speed;
                if (keys.d || keys.arrowright) player.x += speed;
                if (keys.w || keys.arrowup) player.y -= speed;
                if (keys.s || keys.arrowdown) player.y += speed;
                clampPlayer();
            }

            function updateShots() {
                if (frame % 8 === 0)
                    shots.push(
                        { x: player.x - 8, y: player.y - 10 },
                        { x: player.x + 8, y: player.y - 10 },
                    );
                shots = shots.filter((s) => {
                    s.y -= 10;
                    if (
                        Math.abs(s.x - boss.x) < 42 &&
                        Math.abs(s.y - boss.y) < 24
                    ) {
                        boss.hp--;
                        return false;
                    }
                    return s.y > -10;
                });
            }

            function runPatterns() {
                const seq = SEQUENCES[phase][patIdx];
                for (const name of seq) {
                    if (patTime < PATTERN_DURATION[name])
                        PATTERNS[name](patTime);
                }
                patTime++;
                if (
                    patTime >= Math.max(...seq.map((n) => PATTERN_DURATION[n]))
                ) {
                    patTime = 0;
                    patIdx = (patIdx + 1) % SEQUENCES[phase].length;
                }
            }

            function runQueue() {
                queue.forEach((q) => q.t--);
                const due = queue.filter((q) => q.t <= 0);
                queue = queue.filter((q) => q.t > 0);
                due.forEach((q) => q.f());
            }

            function updateBullets() {
                bullets = bullets.filter((b) => {
                    if (b.del > 0) {
                        b.del--;
                        return true;
                    }
                    if (b.hm > 0) {
                        b.hm--;
                        const a = aim(b.x, b.y);
                        b.vx = Math.cos(a) * b.s;
                        b.vy = Math.sin(a) * b.s;
                    }
                    b.vx += b.ax;
                    const pace =
                        (1 + PACE_AMP * Math.sin((2 * PI * b.age) / PACE_PERIOD)) *
                        tempoFactor(b);
                    b.age++;
                    b.x += b.vx * pace;
                    b.y += b.vy * pace;
                    if (Math.hypot(b.x - player.x, b.y - player.y) < b.r + 3)
                        hurtPlayer();
                    return (
                        b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20
                    );
                });
            }

            function updateBeams() {
                beams = beams.filter((b) => {
                    b.age++;
                    b.a += b.da;
                    if (b.age > b.warn && b.age <= b.warn + b.dur) {
                        const path = beamPath(b);
                        for (let i = 0; i < path.length - 1; i++) {
                            if (
                                distToSegment(
                                    player.x,
                                    player.y,
                                    path[i],
                                    path[i + 1],
                                ) <
                                b.w / 2 + 3
                            )
                                hurtPlayer();
                        }
                    }
                    return b.age <= b.warn + b.dur;
                });
            }

            function updateOrbs() {
                orbs = orbs.filter((o) => {
                    o.y += 1.8;
                    if (Math.hypot(o.x - player.x, o.y - player.y) < 16) {
                        takeOrb(o.k);
                        return false;
                    }
                    return o.y < H + 20;
                });
            }

            // 第2形態でHPが6割になったら、効果が入れ替わった玉の選択を強制
            function checkMidPick() {
                if (
                    phase === 1 &&
                    !midPickDone &&
                    boss.hp > 0 &&
                    boss.hp <= boss.max * 0.6
                ) {
                    midPickDone = true;
                    swapOrbs = true;
                    state = S.SELECT;
                    bullets = [];
                    beams = [];
                    queue = [];
                    shots = [];
                    player.x = PLAYER_START.x;
                    player.y = PLAYER_START.y;
                    return true;
                }
                return false;
            }

            // ボス撃破時の形態遷移
            function checkBossDefeated() {
                if (boss.hp > 0 || state !== S.PLAY) return;
                bullets = [];
                beams = [];
                queue = [];
                orbs = [];
                patTime = 0;
                patIdx = 0;
                if (phase === 3) {
                    state = S.WIN;
                } else if (phase === 2) {
                    state = S.FCLEAR; // 偽撃破演出
                    clearTimer = 200;
                } else {
                    phase++;
                    boss.hp = boss.max = BOSS_HP[phase];
                    if (phase === 1) {
                        state = S.SELECT;
                        player.x = PLAYER_START.x;
                        player.y = PLAYER_START.y;
                    }
                }
            }

            function updatePlay() {
                movePlayer();
                if (player.inv > 0) player.inv--;
                history.push({ x: player.x, y: player.y });
                if (history.length > 60) history.shift();

                boss.x = CX + Math.sin(frame / 120) * 100 * (W / 480);

                // 第2形態以降: 一定間隔で玉が降る(順番固定・位置ランダム)
                if (phase >= 1 && frame % 270 === 135) {
                    spawnOrb(
                        ORB_ORDER_MAIN[
                            ((frame / 270) | 0) % ORB_ORDER_MAIN.length
                        ],
                    );
                }

                updateShots();
                runPatterns();
                runQueue();
                updateBullets();
                updateBeams();
                updateOrbs();

                if (checkMidPick()) return;
                checkBossDefeated();
            }

            function update() {
                if (adminOpen) return; // paused while the admin panel is open
                frame++;
                if (keyDebug.t > 0) keyDebug.t--;
                if (invertTimer > 0 && (state === S.PLAY || state === S.SELECT))
                    invertTimer--;
                switch (state) {
                    case S.SELECT:
                        movePlayer();
                        for (let i = 0; i < SELECT_ORBS.length; i++) {
                            const o = selectOrbPos(i);
                            if (Math.hypot(o.x - player.x, o.y - player.y) < SEL_PICK) {
                                takeOrb(selectEffect(i));
                                break;
                            }
                        }
                        break;
                    case S.PLAY:
                        updatePlay();
                        break;
                    case S.GAG:
                        if (gagLock > 0) gagLock--;
                        break;
                    case S.FAKE:
                        if (--fakeTimer <= 0) {
                            state = S.PLAY;
                            player.inv = FAKE_INV_FRAMES; // 5s invincibility on return
                        }
                        break;
                    case S.FCLEAR:
                        if (--clearTimer <= 0) {
                            phase = 3;
                            swapOrbs = false;
                            boss.hp = boss.max = BOSS_HP[3];
                            state = S.PLAY;
                        }
                        break;
                }
            }

            /* =====================================================================
             *  描画
             * ===================================================================== */
            // 幅440pxに収まるよう縮小しながら描画するテキスト
            function drawText(str, x, y, size, color, align = "center") {
                ctx.textAlign = align;
                ctx.fillStyle = color;
                ctx.font = "bold " + size + "px sans-serif";
                while (ctx.measureText(str).width > 440 && size > 10) {
                    ctx.font = "bold " + --size + "px sans-serif";
                }
                ctx.fillText(str, x, y);
            }

            function drawCircle(x, y, r, color, filled = true) {
                ctx.beginPath();
                ctx.arc(x, y, r, 0, 7);
                if (filled) {
                    ctx.fillStyle = color;
                    ctx.fill();
                } else {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            const fillScreen = (color) => {
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, W, H);
            };

            function drawPlayer(color) {
                drawCircle(player.x, player.y, 9, color, false);
                drawCircle(player.x, player.y, 3, "#fff");
            }

            function drawSelect() {
                drawText("好きな玉を選んでください", CX, 240, 24, "#fff");
                drawText("WASDで移動", CX, 400, 16, "#889");
                if (!swapOrbs) {
                    drawText("色玉の効果（途中で変わることがあります）", CX, 50, 15, "#aab");
                    SELECT_ORBS.forEach((o, i) => {
                        const y = 86 + i * 26;
                        drawCircle(CX - 130, y - 5, 7, o.c);
                        drawText(o.n + "玉　" + ORB_HINTS[o.k], CX - 112, y, 16, "#ddd", "left");
                    });
                }
                SELECT_ORBS.forEach((o, i) => {
                    const q = selectOrbPos(i);
                    drawCircle(q.x, q.y, SEL_R, o.c);
                    drawCircle(q.x, q.y, SEL_R + 5, o.c + "8", false);
                });
                drawPlayer("#4df");
            }

            function drawField() {
                // ボス
                ctx.font = "48px serif";
                ctx.textAlign = "center";
                ctx.fillText(
                    state === S.FCLEAR ? "💀" : "👿",
                    boss.x,
                    boss.y + 16,
                );

                // ビーム(予告線 → 本番)
                for (const b of beams) {
                    const active = b.age > b.warn;
                    ctx.beginPath();
                    beamPath(b).forEach((q, i) =>
                        i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]),
                    );
                    ctx.strokeStyle = active ? "#fff" : "rgba(255,80,80,.5)";
                    ctx.lineWidth = active ? b.w : 2;
                    ctx.stroke();
                }
                // 弾
                for (const b of bullets) {
                    ctx.globalAlpha = b.del > 0 ? 0.3 : 1;
                    drawCircle(b.x, b.y, b.r, b.col);
                    ctx.globalAlpha = 1;
                }
                // 玉
                for (const o of orbs) {
                    drawCircle(o.x, o.y, 12, ORB_COLORS[o.k]);
                    drawCircle(o.x, o.y, 17, ORB_COLORS[o.k] + "8", false);
                }
                // 自機ショット・自機(無敵中は点滅)
                ctx.fillStyle = "#9ef";
                shots.forEach((s) => ctx.fillRect(s.x - 1, s.y - 6, 3, 10));
                if (player.inv % 6 < 3)
                    drawPlayer(dmgMul > 1 ? "#3c3" : "#4df");

                // HUD
                ctx.fillStyle = "#333";
                ctx.fillRect(10, 10, W - 20, 8);
                ctx.fillStyle = "#e44";
                ctx.fillRect(
                    10,
                    10,
                    ((W - 20) * Math.max(0, boss.hp)) / boss.max,
                    8,
                );
                drawText(
                    "第" + FORM_NAMES[phase] + "形態",
                    10,
                    36,
                    14,
                    "#aab",
                    "left",
                );
                drawText(
                    "♥".repeat(Math.max(0, player.hp)),
                    10,
                    H - 10,
                    16,
                    "#f66",
                    "left",
                );
                if (invincible)
                    drawText("ADMIN: 無敵", W - 10, 36, 14, "#fc3", "right");
                if (invertTimer > 0)
                    drawText(
                        "操作反転 " + Math.ceil(invertTimer / 60) + "秒",
                        W - 10,
                        H - 10,
                        16,
                        "#f93",
                        "right",
                    );
            }

            function drawOverlay() {
                switch (state) {
                    case S.TITLE:
                        fillScreen("#10101c");
                        ctx.font = "72px serif";
                        ctx.textAlign = "center";
                        ctx.fillText("👿", CX, 200);
                        drawText("世界一", CX, 290, 36, "#fff");
                        drawText("イライラするゲーム", CX, 340, 40, "#f55");
                        drawText(
                            "難しいんじゃない。イライラするだけ。",
                            CX,
                            390,
                            15,
                            "#889",
                        );
                        if (frame % 60 < 40)
                            drawText(
                                "タップ / クリック / Enter でスタート",
                                CX,
                                500,
                                22,
                                "#fff",
                            );
                        drawText(
                            "移動: WASD・矢印キー / スマホは画面をドラッグ　攻撃: 自動",
                            CX,
                            560,
                            14,
                            "#889",
                        );
                        break;
                    case S.GAG: {
                        const b = BTN_GAG_DONE;
                        fillScreen("rgba(0,0,40,.9)");
                        if (gagStep === 0) {
                            drawText("一発芸タイム！", CX, 200, 30, "#6af");
                            drawText(gagText, CX, 320, 28, "#fff");
                        } else {
                            drawText(
                                "最終確認 " + gagStep + "/" + GAG_CONFIRMS.length,
                                CX,
                                200,
                                30,
                                "#fc3",
                            );
                            drawText(GAG_CONFIRMS[gagStep - 1], CX, 320, 26, "#fff");
                        }
                        ctx.fillStyle = gagLock > 0 ? "#456" : "#6af";
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        drawText(
                            gagStep === 0 ? "やりました！" : "はい",
                            CX,
                            460,
                            22,
                            "#012",
                        );
                        drawText(
                            "終わったらボタンを押してね",
                            CX,
                            520,
                            14,
                            "#889",
                        );
                        break;
                    }
                    case S.FAKE: {
                        const b = BTN_FAKE_RESTART;
                        fillScreen("#000");
                        drawText("GAME OVER", CX, 260, 52, "#e22");
                        ctx.fillStyle = "#ddd";
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        drawText("RESTART", CX, 380, 22, "#000");
                        drawText(
                            "5秒待つと？",
                            W - 4,
                            H - 4,
                            9,
                            "#444",
                            "right",
                        );
                        break;
                    }
                    case S.FCLEAR:
                        drawText("CLEAR", CX, 320, 64, "#fd0");
                        break;
                    case S.OVER:
                        fillScreen("rgba(0,0,0,.8)");
                        drawText("GAME OVER", CX, 250, 48, "#e22");
                        drawText(
                            "👿「" + tauntText + "」",
                            CX,
                            330,
                            22,
                            "#fff",
                        );
                        drawText(
                            "タップ / クリック / Enter でもう一度",
                            CX,
                            420,
                            16,
                            "#889",
                        );
                        break;
                    case S.WIN:
                        fillScreen("rgba(0,0,0,.8)");
                        drawText("本物のCLEAR！", CX, 280, 44, "#fd0");
                        drawText("ちゃんと避けられたね", CX, 340, 20, "#fff");
                        drawText(
                            "タップ / クリック / Enter でもう一度",
                            CX,
                            420,
                            16,
                            "#889",
                        );
                        break;
                }
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                if (state === S.SELECT) drawSelect();
                else drawField();
                drawOverlay();
                if (keyDebug.t > 0)
                    drawText(keyDebug.text, W - 6, H - 26, 11, "#8c8", "right");
            }

            /* =====================================================================
             *  メインループ
             * ===================================================================== */
            // Fill the window: logical width follows the window aspect ratio (height stays 640).
            // Narrower than 3:4 -> keep 480 wide and letterbox vertically; wider than MAX_W -> letterbox sideways.
            function layout() {
                const vw = window.innerWidth,
                    vh = window.innerHeight;
                const oldCX = CX;
                W = Math.min(MAX_W, Math.max(MIN_W, Math.round((H * vw) / vh)));
                CX = W / 2;
                const scale = Math.min(vw / W, vh / H);
                const cssW = W * scale,
                    cssH = H * scale;
                canvas.style.width = cssW + "px";
                canvas.style.height = cssH + "px";

                // sharp rendering: backing store = displayed size in device pixels
                const dpr = window.devicePixelRatio || 1;
                canvas.width = Math.max(1, Math.round(cssW * dpr));
                canvas.height = Math.max(1, Math.round(cssH * dpr));
                ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);

                // keep everything that depends on the width in sync
                PLAYER_START.x = CX;
                BTN_FAKE_RESTART.x = CX - BTN_FAKE_RESTART.w / 2;
                BTN_GAG_DONE.x = CX - BTN_GAG_DONE.w / 2;
                if (typeof player !== "undefined" && CX !== oldCX) {
                    player.x += CX - oldCX; // stay at the same place relative to the center
                    clampPlayer();
                    boss.x += CX - oldCX;
                }
            }
            window.addEventListener("resize", layout);
            document.addEventListener("fullscreenchange", layout);

            layout();
            resetGame();
            let accumulator = 0,
                lastTime = performance.now();
            function loop(now) {
                accumulator += Math.min(100, now - lastTime);
                lastTime = now;
                while (accumulator >= STEP_MS) {
                    update();
                    accumulator -= STEP_MS;
                }
                draw();
                requestAnimationFrame(loop);
            }
            loop(lastTime);
        </script>
    </body>
</html>
