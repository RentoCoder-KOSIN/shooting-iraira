<div class="top"><div><h1>超理不尽モード：連動地獄</h1><div class="muted">1000攻撃シーケンス / 4段階連動 / 高難度だけどクリア可能な調整</div></div><div class="row"><button id="random" class="primary">🎲 ランダム</button><button id="auto" class="alt">▶ 連続テスト</button></div></div>
<div class="layout"><section class="stage"><div class="hud"><span>攻撃 <b id="hudNum">0001 / 1000</b></span><span>生存 <b id="time">0.0</b>s</span><span>HP <b id="hp">5</b></span><span>段階 <b id="stageNum">1 / 4</b></span></div><canvas id="game" width="800" height="560"></canvas><div class="controls"><div class="row"><label for="num">番号</label><input id="num" type="number" min="1" max="1000" value="1"><button id="load">攻撃を試す</button><button id="prev">← 前</button><button id="next">次 →</button><button id="restart">↻ やり直す</button><button id="pause">⏸ 一時停止</button></div><div class="muted">移動：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 矢印キー　|　8秒生存でクリア。HP5・高速移動・短い無敵時間あり。予告を見て隙間を抜けよう。</div></div></section>
<aside class="panel"><h2>攻撃データ</h2><div id="big" class="name">#0001</div><div id="attackName" class="name">四方から迫る旋回網</div><div id="desc" class="muted desc"></div><div class="bar"><div id="prog"></div></div><div class="muted">テスト結果： <b id="result">未挑戦</b></div><hr style="border:0;border-top:1px solid var(--line);margin:13px 0"><h2>1000攻撃一覧</h2><input id="search" placeholder="番号・名前で検索" style="width:100%"><div id="list" class="list"></div><hr style="border:0;border-top:1px solid var(--line);margin:13px 0"><h2>テスト状況</h2><div class="muted">試した数： <b id="tested">0 / 1000</b>　クリア： <b id="cleared">0</b></div><div id="log" style="margin-top:8px">番号を選んで開始。</div></aside></div></main>
<script>
(()=>{'use strict';

 {n:'遅延マーカー',d:'現在地へ予告し、爆発の後に追撃弾を発生させる',f:markers},

for(let id=1;id<=TOTAL;id++){
 let mixed=(((id-1)*40503+7919)&65535), seq=[];for(let k=0;k<4;k++){seq.push((mixed>>(k*4))&15)}

 const unique=new Set(seq).size;
 const name=`${wordsA[(id*7+seq[0])%wordsA.length]}${wordsB[(id*3+seq[1])%wordsB.length]}・${mechanics[seq[0]].n}→${mechanics[seq[1]].n}→${mechanics[seq[2]].n}→${mechanics[seq[3]].n}`;
 attacks.push({id,seq,name,desc:seq.map((m,i)=>`${i+1}段階：${mechanics[m].d}`).join('。')+'。各段階の残存弾・レーザーと次段階が重なり、攻撃同士が連動する。'});
}
// Uniqueness of sequences: force a one-to-one base-16 encoding, then restore the #5 special blueprint only (its sequence is still unique).
const signatures=new Set();for(const a of attacks){let s=a.seq.join(',');if(signatures.has(s)){a.seq=[(a.id*5)%16,(a.id*7+1)%16,(a.id*11+2)%16,(a.id*13+3)%16];}signatures.add(a.seq.join(','));}
// Rebuild names after uniqueness safeguard.
for(const a of attacks){a.name=`${wordsA[(a.id*7+a.seq[0])%wordsA.length]}${wordsB[(a.id*3+a.seq[1])%wordsB.length]}・${a.seq.map(i=>mechanics[i].n).join('→')}`;a.desc=a.seq.map((m,i)=>`${i+1}段階：${mechanics[m].d}`).join('。')+'。前段階の残存攻撃と次段階が重なって連動する。';}
let id=1,player={x:400,y:475,r:7},bullets=[],beams=[],hazards=[],particles=[],elapsed=0,last=0,spawn=0,paused=false,dead=false,won=false,auto=false,autoTimer=0,invuln=1.8,keys={},tested=new Set(),cleared=new Set(),stageLast=-1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
function log(t){$('log').innerHTML=t+'<br>'+ $('log').innerHTML;while($('log').childElementCount>14)$('log').lastChild.remove()}
function atk(){return attacks[id-1]}
function choose(n,reset=true){id=clamp(Math.floor(+n||1),1,TOTAL);$('num').value=id;$('hudNum').textContent=String(id).padStart(4,'0')+' / 1000';$('big').textContent='#'+String(id).padStart(4,'0');$('attackName').textContent=atk().name;$('desc').textContent=atk().desc;$('prog').style.width=(id/TOTAL*100)+'%';renderList();if(reset)restart()}
function renderList(){let q=$('search').value.toLowerCase(),start=Math.max(1,id-24),end=Math.min(TOTAL,id+65),a=[];for(let i=1;i<=TOTAL;i++){let v=attacks[i-1];if((String(i).includes(q)||v.name.toLowerCase().includes(q))&&(q||i>=start&&i<=end)){a.push(v);if(a.length>=100)break}}$('list').innerHTML=a.map(v=>`<div class="item ${v.id===id?'active':''}" data-id="${v.id}">#${String(v.id).padStart(4,'0')}　${v.name}</div>`).join('');$('list').querySelectorAll('.item').forEach(e=>e.onclick=()=>choose(+e.dataset.id))}
function restart(){player={x:400,y:475,r:7};bullets=[];beams=[];hazards=[];particles=[];elapsed=0;spawn=0;dead=false;won=false;invuln=1.8;stageLast=-1;$('hp').textContent='5';$('time').textContent='0.0';$('result').textContent='挑戦中';$('stageNum').textContent='1 / 4';log('開始 #'+id+'：'+atk().name)}
function bullet(x,y,vx,vy,r=5,life=5,type='normal',extra={}){if(bullets.length<420)bullets.push({x,y,vx,vy,r,life,age:0,type,seed:Math.random()*6.28,...extra})}
function beam(x,y,w,h,life=.75,ang=0,tele=.28){if(beams.length<18)beams.push({x,y,w,h,life,max:life,ang,tele,age:0})}
function hazard(x,y,r,delay=.8,life=.55,kind='blast'){if(hazards.length<40)hazards.push({x,y,r,delay,life,age:0,kind,done:false})}
function radial(x,y,n,speed,offset=0,r=5,type='normal'){for(let i=0;i<n;i++){let a=offset+i*Math.PI*2/n;bullet(x,y,Math.cos(a)*speed,Math.sin(a)*speed,r,5,type)}}
function aimed(x,y,speed,r=5,type='normal',lead=0){let tx=player.x+Math.cos(lead)*22,ty=player.y+Math.sin(lead)*22,a=Math.atan2(ty-y,tx-x);bullet(x,y,Math.cos(a)*speed,Math.sin(a)*speed,r,5,type)}
function phase(){return Math.min(3,Math.floor(elapsed/STAGE))}
function fireMechanic(m,stage){const t=elapsed,px=player.x,py=player.y,cx=400+Math.sin(t*1.1+id)*145,cy=170+Math.cos(t*.8+id*.2)*70;let k=(id+stage*3)%4;
 if(id===5&&stage===0){if((t%1.15)<.36){bullet(400,105,0,0,15,7,'homing',{vx:0,vy:0,customHoming:true});radial(400,105,8,86,t*.7,4)}return;}
 switch(m){
 case 0: {let a=t*1.4+stage*.8+id*.03;for(let j=0;j<2;j++){let ang=a+j*Math.PI;for(let q=0;q<2;q++){let z=ang+q*.15;bullet(cx,cy,Math.cos(z)*(125+q*30),Math.sin(z)*(125+q*30),5,5,'spiral')}}radial(cx,cy,7,95,-a,4);break}
 case 1:{let gap=(px+Math.sin(t*1.5+stage)*120),y=-8;for(let x=22;x<W;x+=34){if(Math.abs(x-gap)>66)bullet(x,y,Math.sin(t*2+x*.03)*30,150+stage*13,5,5,'wall');}if(spawn%2===0){let gap2=W-gap;for(let x=22;x<W;x+=38)if(Math.abs(x-gap2)>58)bullet(x,H+4,Math.sin(t+x)*22,-145,5,5,'wall')}break}
 case 2:{for(let j=0;j<3;j++){let sx=60+j*340,sy=35+(j%2)*60;aimed(sx,sy,120+j*16,7,'homing',Math.sin(t+j)*.6)}radial(cx,cy,5,82,t*.8,4);break}
 case 3:{let x=clamp(px+Math.sin(t*1.4+stage)*180,35,W-35);beam(x,H/2,24,H,.9,0,.35);let y=clamp(py+Math.cos(t*1.2)*100,45,H-45);beam(W/2,y,W,22,.7,0,.3);break}
 case 4:{hazard(px+Math.sin(t*2+stage)*65,py-35,38,.45,.42);if(spawn%2===0)aimed(cx,cy,155,5,'normal');break}
 case 5:{for(let j=0;j<3;j++){let a=t*1.7+j*2.094;bullet(cx+Math.cos(a)*40,cy+Math.sin(a)*40,Math.cos(a+1.1)*155,Math.sin(a+1.1)*155,5,5,'bounce',{bounce:true})}break}
 case 6:{for(let j=0;j<3;j++){let a=t*1.1+j*2.1;bullet(cx,cy,Math.cos(a)*105,Math.sin(a)*105,9,2.5,'split',{splitAt:1.05})}break}
 case 7:{let safeX=(id*47+t*60+stage*90)%W,safeY=(id*23+t*42)%H;for(let x=35;x<W;x+=82)if(Math.abs(x-safeX)>29)beam(x,H/2,17,H,.55,0,.25);for(let y=35;y<H;y+=76)if(Math.abs(y-safeY)>26)beam(W/2,y,W,17,.55,0,.25);break}
 case 8:{let sx=60+((id*37+stage*100)%680),sy=20;bullet(sx,sy,Math.sin(t*2)*65,80,10,3.5,'dive',{dive:true,stopY:180+((id*19)%130),stopped:false});aimed(W-sx,40,120,5,'normal');break}
 case 9:{let a=t*.9+stage*.5;for(let j=0;j<7;j++){let ang=a+(j-3)*.19;bullet(cx,cy,Math.cos(ang)*145,Math.sin(ang)*145,5,4.7,'fan')}break}
 case 10:{for(let j=0;j<3;j++){let r=65+j*45,ang=t*.55+j*1.8;hazard(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r,28,.28,.38,'ring')}radial(cx,cy,6,105,t,4);break}
 case 11:{for(let j=0;j<4;j++){let sy=70+j*115;aimed(8,sy,185,5,'normal');aimed(W-8,H-sy,185,5,'normal')}break}
 case 12:{let x=clamp(px+Math.sin(t*1.5+stage)*110,24,W-24);beam(x,H/2,31,H,.75,0,.42);if(spawn%2===0)aimed(cx,cy,130,5,'homing');break}
 case 13:{let gap=(id*13+t*105+stage*170)%W;for(let x=20;x<W;x+=27)if(Math.abs(x-gap)>47)bullet(x,-5,0,170,4.5,4.5,'normal');hazard(gap,H-70,38,.55,.4);break}
 case 14:{let a=Math.atan2(py-cy,px-cx);for(let j=0;j<5;j++){let ang=a+j*.48-1.0;bullet(cx,cy,Math.cos(ang)*145,Math.sin(ang)*145,5,6,'return',{returnAt:1.1})}break}
 case 15:{let corners=[[18,18],[W-18,18],[18,H-18],[W-18,H-18]];corners.forEach((p,j)=>aimed(p[0],p[1],150+j*12,5,'normal',j*Math.PI/2));radial(W/2,H/2,8,115,t*.6,4);break}
 }
}
function spiral(x,y,vx,vy,r,life,type){/* placeholder for function refs */}
function waveWall(){} function hunters(){} function sweep(){} function markers(){} function ricochet(){} function splitter(){} function grid(){} function dive(){} function fan(){} function rings(){} function crossfire(){} function lockbeam(){} function safeRelay(){} function boomerang(){} function corners(){}
function tick(dt){if(paused)return;if(!dead&&!won){elapsed+=dt;spawn+=dt;invuln=Math.max(0,invuln-dt);let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),len=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx/len*285*dt,player.r,W-player.r);player.y=clamp(player.y+dy/len*285*dt,player.r,H-player.r);
 let st=phase();$('stageNum').textContent=(st+1)+' / 4';if(st!==stageLast){stageLast=st;log('第'+(st+1)+'段階：'+mechanics[atk().seq[st]].n)}
 if(spawn>=.48){spawn=0;let m=atk().seq[st];fireMechanic(m,st); // controlled overlap: intense but leaves readable escape windows
 if(st>0&&Math.random()<.28)fireMechanic(atk().seq[st-1],st-1);
 }
 for(let b of bullets){b.age+=dt;if(b.type==='homing'&&b.age<1.7){let a=Math.atan2(player.y-b.y,player.x-b.x),v=b.customHoming?185:Math.max(105,Math.hypot(b.vx,b.vy)),cur=Math.atan2(b.vy,b.vx),dif=Math.atan2(Math.sin(a-cur),Math.cos(a-cur));let na=cur+clamp(dif,-1.8*dt,1.8*dt);b.vx=Math.cos(na)*v;b.vy=Math.sin(na)*v}if(b.type==='dive'&&b.dive){if(!b.stopped&&b.y>=b.stopY){b.stopped=true;b.stopAge=0;b.vx=0;b.vy=0}else if(b.stopped){b.stopAge+=dt;if(b.stopAge>.35){b.vx=0;b.vy=310;b.dive=false}}}if(b.type==='bounce'){if(b.x<b.r||b.x>W-b.r)b.vx*=-1;if(b.y<b.r||b.y>H-b.r)b.vy*=-1}if(b.type==='return'&&b.age>b.returnAt&&!b.returned){b.vx*=-1;b.vy*=-1;b.returned=true}if(b.type==='split'&&!b.splitDone&&b.age>b.splitAt){b.splitDone=true;for(let j=0;j<5;j++){let a=j*Math.PI*2/5;bullet(b.x,b.y,Math.cos(a)*155,Math.sin(a)*155,3.8,3.5,'normal')}}if(b.type==='wall'){}b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}
 bullets=bullets.filter(b=>b.life>0&&b.x>-50&&b.x<W+50&&b.y>-70&&b.y<H+70);
 for(let z of beams)z.age+=dt;beams=beams.filter(z=>z.age<z.life+z.tele);
 for(let h of hazards){h.age+=dt;if(!h.done&&h.age>=h.delay){h.done=true;radial(h.x,h.y,10,135,Math.random()*6.28,4);if(h.kind==='ring')radial(h.x,h.y,8,90,Math.random()*6.28,4)}}hazards=hazards.filter(h=>h.age<h.delay+h.life);
 for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
 if(invuln<=0){let hit=false;for(let b of bullets)if(Math.hypot(player.x-b.x,player.y-b.y)<player.r+b.r*0.72){hit=true;break}if(!hit)for(let z of beams){if(z.age<z.tele)continue;if(z.ang===0&&player.x>z.x-z.w/2&&player.x<z.x+z.w/2&&player.y>z.y-z.h/2&&player.y<z.y+z.h/2){hit=true;break}}if(!hit)for(let h of hazards)if(h.done&&Math.hypot(player.x-h.x,player.y-h.y)<h.r){hit=true;break}if(hit){let hp=+( $('hp').textContent)-1;$('hp').textContent=hp;invuln=1.45;for(let j=0;j<16;j++)particles.push({x:player.x,y:player.y,vx:rand(-140,140),vy:rand(-140,140),life:.5});if(hp<=0){dead=true;$('result').textContent='失敗';tested.add(id);$('tested').textContent=tested.size+' / 1000';log('失敗 #'+id);if(auto)autoTimer=.8}}}
 if(elapsed>=GOAL&&!dead){won=true;$('result').textContent='クリア';tested.add(id);cleared.add(id);$('tested').textContent=tested.size+' / 1000';$('cleared').textContent=cleared.size;log('クリア #'+id);if(auto)autoTimer=.8}
 $('time').textContent=elapsed.toFixed(1);
 }

}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#080b15';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(90,117,170,.13)';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 // stage meter and active-mechanic hint
 ctx.fillStyle='rgba(255,255,255,.045)';ctx.fillRect(0,0,W,5);ctx.fillStyle='#ff4169';ctx.fillRect(0,0,W*(elapsed/GOAL),5);
 for(let h of hazards){ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.strokeStyle=h.done?'rgba(255,75,105,.75)':'rgba(255,190,80,.65)';ctx.lineWidth=2;ctx.stroke();if(!h.done){ctx.beginPath();ctx.arc(h.x,h.y,h.r*(1-h.age/h.delay),0,Math.PI*2);ctx.strokeStyle='rgba(255,220,120,.8)';ctx.stroke()}}
 for(let z of beams){let live=z.age>=z.tele;ctx.save();ctx.globalAlpha=live?.85:.32;ctx.fillStyle=live?'#ff365d':'#ffca65';if(z.ang===0){ctx.fillRect(z.x-z.w/2,z.y-z.h/2,z.w,z.h);if(!live){ctx.strokeStyle='#ffd078';ctx.strokeRect(z.x-z.w/2,z.y-z.h/2,z.w,z.h)}}ctx.restore()}
 for(let b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,b.r+3,0,Math.PI*2);ctx.fillStyle=b.type==='homing'?'rgba(255,115,65,.18)':'rgba(255,45,92,.15)';ctx.fill();ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=b.type==='homing'?'#ff9b4d':b.type==='split'?'#ff6fba':b.type==='bounce'?'#f9e66b':'#ff4169';ctx.fill()}
 for(let p of particles){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle='#ff6688';ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;
 ctx.beginPath();ctx.arc(player.x,player.y,player.r+5,0,Math.PI*2);ctx.strokeStyle=invuln>0?'#ffffff':'rgba(97,232,255,.45)';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fillStyle=invuln>0?'#ffffff':'#61e8ff';ctx.fill();ctx.fillStyle='#fff';ctx.font='13px system-ui';ctx.fillText('PHASE '+(phase()+1)+' / 4',12,23);ctx.fillStyle='#aab5d0';ctx.fillText('連動：'+atk().seq.map(i=>mechanics[i].n).join(' → '),12,H-14);
 if(dead||won||paused){ctx.fillStyle='rgba(2,4,10,.65)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=won?'#72f3b1':dead?'#ff6481':'#fff';ctx.font='bold 38px system-ui';ctx.fillText(won?'CLEAR!':dead?'FAILED':'PAUSED',W/2,H/2);ctx.font='16px system-ui';ctx.fillStyle='#e8edff';ctx.fillText(won?'次の攻撃へ進めるよ':dead?'やり直すか番号を変えて再挑戦':'一時停止中',W/2,H/2+32);ctx.textAlign='left'}
}
function frame(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;tick(dt);draw();requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
$('load').onclick=()=>choose($('num').value);$('prev').onclick=()=>choose(id-1);$('next').onclick=()=>choose(id+1);$('restart').onclick=restart;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ 再開':'⏸ 一時停止'};$('random').onclick=()=>choose(1+Math.floor(Math.random()*TOTAL));$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'■ 連続テスト停止':'▶ 連続テスト';if(auto){autoTimer=0;log('連続テスト開始')}};$('search').oninput=renderList;

window.__attackSanity={count:attacks.length,uniqueSequences:new Set(attacks.map(a=>a.seq.join(','))).size,mechanics:mechanics.length};
choose(1,false);restart();requestAnimationFrame(frame);
